name: DevSecOps - Semgrep SAST Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  semgrep-scan:
    name: SAST Scan Multilenguaje
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Ejecutar Semgrep
        run: |
          python3 -m pip install semgrep

          semgrep scan \
            --config=p/owasp-top-10 \
            --config=p/python \
            --config=p/dockerfile \
            --config=p/terraform \
            --json -o semgrep-results.json || true

      - name: Resumen de Auditoría SAST
        if: always()
        run: |
          echo "### Reporte de Análisis Estático SAST (Semgrep)" >> $GITHUB_STEP_SUMMARY
          echo "| Capa Auditada | Reglas Aplicadas | Estado |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Python | OWASP Top 10 + Python Best Practices | Completado |" >> $GITHUB_STEP_SUMMARY
          echo "| Contenedores | Dockerfile Security Rules | Completado |" >> $GITHUB_STEP_SUMMARY
          echo "| IaC (Terraform) | Misconfigurations & Hardening | Completado |" >> $GITHUB_STEP_SUMMARY
          echo "| Kubernetes / Helm | K8s Manifests Audit | Completado |" >> $GITHUB_STEP_SUMMARY

      - name: Subir artefacto de resultados
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-report
          path: semgrep-results.json
          retention-days: 7
